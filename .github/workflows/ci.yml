name: Quality Shop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Testing_QualityShop.sln
      - name: Check formatting in the new variants (baseline remains exercise material)
        run: dotnet format Testing_QualityShop.sln --verify-no-changes --no-restore --include variant-02-functional-core variant-03-dependency-injection variant-04-sql-server
      - run: dotnet build Testing_QualityShop.sln --configuration Release --no-restore
      - name: Dependency vulnerability report
        run: dotnet list Testing_QualityShop.sln package --vulnerable --include-transitive

  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit and API regression gates without SQL or browser
        shell: pwsh
        run: ./scripts/Test-Fast.ps1 -Configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-test-results
          path: '**/TestResults/**'

  teaching-demonstrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Deliberately red baseline examples (visible, outside regression gates)
        continue-on-error: true
        run: dotnet test variant-01-baseline/Testing_QualityShop.Test.Unit --filter TestCategory=DefectDemonstration --logger trx --results-directory TestResults/demonstrations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teaching-demonstration-results
          path: TestResults/**
      # FlakyExample stays Explicit; run it by name as a classroom experiment.

  baseline-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build variant-01-baseline/Testing_QualityShop.Test.Ui
      - run: pwsh variant-01-baseline/Testing_QualityShop.Test.Ui/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium
      - name: Start baseline and wait for HTTP readiness
        run: |
          ASPNETCORE_ENVIRONMENT=Testing dotnet run --project variant-01-baseline/Testing_QualityShop.Api --no-launch-profile --urls http://127.0.0.1:5080 > qualityshop.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail http://127.0.0.1:5080/api/products; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run baseline browser tests
        env:
          QUALITYSHOP_BASE_URL: http://127.0.0.1:5080
        run: dotnet test variant-01-baseline/Testing_QualityShop.Test.Ui --no-build --logger trx --results-directory TestResults/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-ui-diagnostics
          path: |
            **/playwright-artifacts/**
            TestResults/**
            qualityshop.log

  sql-full-system:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build variant-04-sql-server/Testing_QualityShop.SqlServer.Test.Ui
      - run: pwsh variant-04-sql-server/Testing_QualityShop.SqlServer.Test.Ui/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium
      - name: Disposable SQL, real API integration, browser and k6 smoke
        shell: pwsh
        run: ./scripts/Test-Sql.ps1 -IncludeUi -IncludeSmoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-full-system-diagnostics
          path: |
            TestResults/**
            **/playwright-artifacts/**
            sql-lab*.log
